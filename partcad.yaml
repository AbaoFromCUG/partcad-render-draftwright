# Technical drawings are documents about a shape, so these implementations
# belong to render:, even though pc export can request them as well.
name: //pub/feature/render/draftwright
desc: Technical drawings (PDF, SVG, DXF) produced by Draftwright 0.6.

# Package-defined output implementations, including PDF, are available from
# PartCAD 0.8.27. The implementation imports no PartCAD internals.
partcad: ">=0.8.27"

docs:
  intro: |
    Generate annotated orthographic views, sections, dimensions and a title
    block with [Draftwright](https://github.com/pzfreo/draftwright).
    This package uses the Rust-backed Draftwright 0.6 Python API. PDF, SVG
    and DXF are written by the native engine and are deterministic.

    Engine findings are returned as PartCAD warnings; an error fails the
    render after writing the file so that it can be inspected.
  usage: |
    Draw an object without changing its package:

    ```shell
    pc --no-ansi render -t pdf -e //pub/feature/render/draftwright //your/package:bracket
    pc --no-ansi render -t svg -e //pub/feature/render/draftwright //your/package:bracket
    ```

    Set drawing options such as title, number, material, tolerance, scale,
    page, projection and zones under render:, per package or per object.
    See README.md for the changes from the older Python engine.

# Draftwright's native wheel does not install build123d. The adapter needs it
# to wrap PartCAD's OCCT shape and hand it to the public Part API. Pin both
# deliberately; ReportLab and SVGLib are no longer used to write PDF files.
pythonVersion: "3.13"
pythonRequirements:
  - draftwright==0.6.1
  - build123d==0.11.1

# The native engine always produces deterministic output. False retains
# PartCAD's normal default: the caller does not require reproducibility, but
# the implementation may still provide it. True is supported as well.
render:
  pdf:
    desc: A technical drawing of the object, as PDF.
    path: render_draftwright.py
    extension: pdf
    reproducible: false
  svg:
    desc: A technical drawing of the object, as SVG.
    path: render_draftwright.py
    extension: svg
    reproducible: false
  dxf:
    desc: A technical drawing of the object, as DXF.
    path: render_draftwright.py
    extension: dxf
    reproducible: false
